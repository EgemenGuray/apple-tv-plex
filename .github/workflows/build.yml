name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple TV
            scheme: PlexHDR
            destination: generic/platform=tvOS
          - name: iPhone and iPad
            scheme: PlexHDR-iOS
            destination: generic/platform=iOS
          - name: Mac
            scheme: PlexHDR-macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build ${{ matrix.name }} (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PlexHDR.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*(PlexHDR/)|BUILD (SUCCEEDED|FAILED)|\*\*" | head -300
