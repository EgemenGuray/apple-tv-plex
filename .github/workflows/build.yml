name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for Apple TV (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PlexHDR.xcodeproj -scheme PlexHDR \
            -destination 'generic/platform=tvOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*(PlexHDR/)|BUILD (SUCCEEDED|FAILED)|\*\*" | head -300
